[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reviewer"
version = "0.1.0"
description = "AI code reviewer — LangGraph 单图双模式代码审查助手（Spec：Roll1ng-1n/code-reviewer#12）"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2,<2.0",
    "pydantic>=2.5",
]

[project.scripts]
reviewer = "reviewer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer"]
